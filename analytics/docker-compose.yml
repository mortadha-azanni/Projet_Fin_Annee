version: "3.8"

services:
  cubejs:
    build: ./cubejs
    container_name: analytics_cubejs
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: ${DB_HOST}
      CUBEJS_DB_PORT: ${DB_PORT}
      CUBEJS_DB_NAME: ${DB_NAME}
      CUBEJS_DB_USER: ${DB_USER}
      CUBEJS_DB_PASS: ${DB_PASSWORD}
      CUBEJS_DB_SSL: "true"
      CUBEJS_DB_SSL_REJECT_UNAUTHORIZED: "false"
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "true"
      PORT: "4000"
    networks:
      - pfa-network

  dashboard:
    build: ./dashboard
    container_name: analytics_dashboard
    ports:
      - "3001:80"
    restart: unless-stopped
    depends_on:
      - cubejs
    environment:
      VITE_CUBEJS_API_URL: http://localhost:4000/cubejs-api/v1
      VITE_CUBEJS_TOKEN: ${CUBEJS_API_SECRET}
    networks:
      - pfa-network

networks:
  pfa-network:
    external: true
    name: projet_fin_annee_pfa-network
