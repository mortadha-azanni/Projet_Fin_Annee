services:
  gateway:
    build:
      context: ./gateway_node
      dockerfile: Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - SCRAPER_URL=${SCRAPER_URL:-http://scraper:8000}
      - RANKER_URL=${RANKER_URL:-http://ranker:8000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - ./gateway_node:/app
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scraper:
    build:
      context: ./scraper_node
      dockerfile: Dockerfile
    container_name: scraper
    ports:
      - "${SCRAPER_PORT:-8001}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    networks:
      - pfa-network
    volumes:
      - ./scraper_node:/app
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  ranker:
    build:
      context: ./ranker_node
      dockerfile: Dockerfile
    container_name: ranker
    ports:
      - "${RANKER_PORT:-8002}:8000"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - ./ranker_node:/app
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_LOCAL_PORT:-6380}:6379"
    networks:
      - pfa-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  pfa-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
