services:
  gateway:
    build:
      context: ./gateway_node
      dockerfile: Dockerfile
    container_name: gateway
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - SCRAPER_URL=${SCRAPER_URL:-http://scraper:8000}
      - RANKER_URL=${RANKER_URL:-http://ranker:8000}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=hardlink
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - gateway_venv:/app/.venv
      - uv_cache:/root/.cache/uv
      - python_cache:/root/.local/share/uv/python
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scraper:
    build:
      context: ./scraper_node
      dockerfile: Dockerfile
    container_name: scraper
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${SCRAPER_PORT:-8001}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=hardlink
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - scraper_venv:/app/.venv
      - uv_cache:/root/.cache/uv
      - python_cache:/root/.local/share/uv/python
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  scraper_worker:
    build:
      context: ./scraper_node
      dockerfile: Dockerfile
    container_name: scraper_worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=hardlink
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - scraper_worker_venv:/app/.venv
      - uv_cache:/root/.cache/uv
      - python_cache:/root/.local/share/uv/python
    command: ["uv", "run", "celery", "-A", "celery_app", "worker", "--loglevel=info", "--purge"]

  ranker:
    build:
      context: ./ranker_node
      dockerfile: Dockerfile
    container_name: ranker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "${RANKER_PORT:-8002}:8000"
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=hardlink
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - ranker_venv:/app/.venv
      - huggingface_cache:/root/.cache/huggingface
      - uv_cache:/root/.cache/uv
      - python_cache:/root/.local/share/uv/python
    command: ["uv", "run", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  celery_worker:
    build:
      context: ./ranker_node
      dockerfile: Dockerfile
    container_name: celery_worker
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - UV_LINK_MODE=hardlink
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pfa-network
    volumes:
      - celery_worker_venv:/app/.venv
      - huggingface_cache:/root/.cache/huggingface
      - uv_cache:/root/.cache/uv
      - python_cache:/root/.local/share/uv/python
    command: ["uv", "run", "celery", "-A", "celery_app", "worker", "--concurrency=1", "--loglevel=info"]

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_LOCAL_PORT:-6380}:6379"
    networks:
      - pfa-network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  pfa-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  huggingface_cache:
    driver: local
  gateway_venv:
    driver: local
  scraper_venv:
    driver: local
  ranker_venv:
    driver: local
  scraper_worker_venv:
    driver: local
  celery_worker_venv:
    driver: local
  uv_cache:
    driver: local
  python_cache:
    driver: local
