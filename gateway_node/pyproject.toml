[project]
name = "gateway-node"
version = "0.1.0"
description = "API Gateway for scraper and ranker microservices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.2",
    "uvicorn>=0.41.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "websockets>=12.0.0",
    "pydantic>=2.0.0",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "supabase>=2.28.3",
    "asyncpg>=0.31.0",
    "python-multipart>=0.0.26",
    "pydantic-settings>=2.0.0",
]
