<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranker Pipeline Test</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #0b1220;
            color: #e5e7eb;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            gap: 16px;
        }

        .card {
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 16px;
        }

        h1, h2 {
            margin: 0 0 12px;
        }

        .row {
            display: grid;
            gap: 10px;
        }

        @media (min-width: 900px) {
            .row.two {
                grid-template-columns: 1fr 1fr;
            }
        }

        label {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 4px;
            display: block;
        }

        input, textarea, button {
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #0f172a;
            color: #e5e7eb;
            padding: 10px 12px;
            font-size: 14px;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            cursor: pointer;
            background: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .status {
            padding: 8px 10px;
            border-radius: 8px;
            background: #0f172a;
            border: 1px solid #334155;
            font-size: 13px;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 12px;
            max-height: 350px;
            overflow: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Ranker API + WebSocket Test</h1>
            <div class="row two">
                <div>
                    <label for="apiBase">Ranker API Base URL</label>
                    <input id="apiBase" value="http://localhost:8002" />
                </div>
                <div>
                    <label for="wsBase">WebSocket Base URL</label>
                    <input id="wsBase" value="ws://localhost:8002" />
                </div>
            </div>
            <div style="margin-top: 10px;">
                <label for="query">Search Query</label>
                <textarea id="query">I want an ASUS laptop with RTX for gaming under 3000dt</textarea>
            </div>
            <div style="margin-top: 12px;" class="row two">
                <button id="runBtn" onclick="startSearch()">Run Pipeline</button>
                <button onclick="clearOutput()" style="background:#1f2937;border-color:#374151;">Clear Output</button>
            </div>
            <div id="status" class="status" style="margin-top:12px;">Idle</div>
        </div>

        <div class="row two">
            <div class="card">
                <h2>Logs</h2>
                <pre id="logs"></pre>
            </div>
            <div class="card">
                <h2>Final Ranked Results (JSON)</h2>
                <pre id="results"></pre>
            </div>
        </div>

        <div class="card">
            <h2>Final LLM Response (Markdown)</h2>
            <pre id="finalResponse"></pre>
        </div>
    </div>

    <script>
        let activeSocket = null;

        function log(msg) {
            const out = document.getElementById("logs");
            out.textContent += msg + "\n";
            out.scrollTop = out.scrollHeight;
        }

        function setStatus(text) {
            document.getElementById("status").textContent = text;
        }

        function clearOutput() {
            document.getElementById("logs").textContent = "";
            document.getElementById("results").textContent = "";
            document.getElementById("finalResponse").textContent = "";
            setStatus("Idle");
        }

        function setRunning(running) {
            document.getElementById("runBtn").disabled = running;
        }

        async function startSearch() {
            const apiBase = document.getElementById("apiBase").value.trim().replace(/\/$/, "");
            const wsBase = document.getElementById("wsBase").value.trim().replace(/\/$/, "");
            const query = document.getElementById("query").value.trim();

            if (!query) {
                setStatus("Query is required");
                return;
            }

            if (activeSocket) {
                activeSocket.close();
                activeSocket = null;
            }

            document.getElementById("results").textContent = "";
            document.getElementById("finalResponse").textContent = "";
            setRunning(true);
            setStatus("Submitting /search request...");
            log(`POST ${apiBase}/search`);

            try {
                const response = await fetch(`${apiBase}/search`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ query })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Failed to start search");
                }

                const taskId = data.task_id;
                if (!taskId) {
                    throw new Error("No task_id returned from /search");
                }

                log(`Task created: ${taskId}`);
                const wsUrl = `${wsBase}/ws/status/${taskId}`;
                setStatus(`Connecting WebSocket: ${wsUrl}`);
                log(`WS CONNECT ${wsUrl}`);

                const ws = new WebSocket(wsUrl);
                activeSocket = ws;

                ws.onmessage = function(event) {
                    const payload = JSON.parse(event.data);
                    const state = payload.state || "UNKNOWN";
                    const status = payload.status || "No status";

                    setStatus(`[${state}] ${status}`);
                    log(`[${state}] ${status}`);

                    if (state === "SUCCESS") {
                        document.getElementById("results").textContent = JSON.stringify(payload.results || [], null, 2);
                        document.getElementById("finalResponse").textContent = payload.final_response || "(empty final_response)";
                        if (payload.cache_key) {
                            log(`Cache key: ${payload.cache_key}`);
                        }
                        setRunning(false);
                    }

                    if (state === "FAILURE") {
                        log(`ERROR: ${payload.error || "Task failed"}`);
                        setRunning(false);
                    }
                };

                ws.onclose = function() {
                    log("WebSocket closed.");
                    setRunning(false);
                };

                ws.onerror = function() {
                    log("WebSocket error.");
                    setRunning(false);
                };
            } catch (error) {
                log(`ERROR: ${error.message}`);
                setStatus(`Error: ${error.message}`);
                setRunning(false);
            }
        }

        clearOutput();
    </script>
</body>
</html>
